services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: mmenouer
      POSTGRES_PASSWORD: 123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./First_Init.sql:/docker-entrypoint-initdb.d/First_Init.sql
volumes:
  postgres_data: